<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Frontend Mentor | Password generator app</title>
  </head>
  <body>
    <h2>Password Generator</h2>
    <div>
      <p class="generatedPassword">P4$5W0rD!</p>
      <img src="assets/images/icon-copy.svg" alt="copy icon" id="copy" />
    </div>
    <div>
      <div>
        <p>Character Length</p>
        <p class="passwordLength">10</p>
      </div>
      <input type="range" id="length" min="4" max="25" value="10" />
      <input type="checkbox" name="" id="uppercase" />Include Uppercase Letters
      <input type="checkbox" name="" id="lowercase" /> Include Lowercase Letters
      <input type="checkbox" name="" id="numbers" />Include Numbers
      <input type="checkbox" name="" id="symbols" />Include Symbols
      <div><p>Strength</p></div>
      <button>
        Generate <img src="assets/images/icon-arrow-right.svg" alt="" />
      </button>
    </div>
  </body>
</html>
