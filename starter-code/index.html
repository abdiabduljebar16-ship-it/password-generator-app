<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Frontend Mentor | Password generator app</title>
  </head>
  <body>
    <h2>Password Generator</h2>
    <div class="passwordContainer">
      <p class="generatedPassword">P4$5W0rD!</p>
      <img src="assets/images/icon-copy.svg" alt="copy icon" id="copy" />
    </div>
    <div class="card">
      <div class="lengthInput">
        <p>Character Length</p>
        <p class="passwordLength">10</p>
      </div>
      <input type="range" id="length" min="4" max="25" value="6" />
      <div class="uppercaseContainer">
        <input type="checkbox" name="" id="uppercase" class="check" />
        <p>Include Uppercase Letters</p>
      </div>
      <div class="lowercaseContainer">
        <input type="checkbox" name="" id="lowercase" class="check" />
        <p>Include Lowercase Letters</p>
      </div>
      <div class="numbersContainer">
        <input type="checkbox" name="" id="numbers" class="check" />
        <p>Include Numbers</p>
      </div>
      <div class="symbolsContainer">
        <input type="checkbox" name="" id="symbols" class="check" />
        <p>Include Symbols</p>
      </div>
      <div class="strengthTester">
        <p>Strength</p>
        <div class="strengthBox">
          <p class="strength">Medium</p>
          <div class="box box1"></div>
          <div class="box box2"></div>
          <div class="box box3"></div>
          <div class="box"></div>
        </div>
      </div>
      <button class="generate">
        GENERATE <img src="assets/images/icon-arrow-right.svg" alt="" />
      </button>
    </div>
  </body>
</html>
